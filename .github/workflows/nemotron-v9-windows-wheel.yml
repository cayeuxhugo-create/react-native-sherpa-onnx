name: Nemotron V9 - N-best selection laboratory (lab only)

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Version de Python Windows utilisee pour V9-Replay (ex: 3.12)"
        type: choice
        required: true
        default: '3.12'
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
  push:
    branches:
      - audit/nemotron-v9-replay
    paths:
      - .github/workflows/nemotron-v9-windows-wheel.yml

permissions:
  contents: read

jobs:
  windows-wheel:
    name: Windows x64 - Python ${{ inputs.python_version || '3.12' }}
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SHERPA_ONNX_CMAKE_ARGS: >-
        -DCMAKE_BUILD_TYPE=Release
        -DSHERPA_ONNX_ENABLE_TTS=OFF
        -DSHERPA_ONNX_ENABLE_BINARY=OFF
        -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF
        -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF
        -DSHERPA_ONNX_ENABLE_C_API=OFF
        -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Checkout pinned sherpa-onnx only
        shell: pwsh
        run: |
          git submodule update --init third_party/sherpa-onnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pinned NeMo beam-search source
        shell: pwsh
        run: |
          $expected = '3df7adacc0d5f140e4e81b746dac0fbeeac16fab'
          $actual = (git -C third_party/sherpa-onnx rev-parse HEAD).Trim()
          Write-Host "Sherpa revision: $actual"
          if ($actual -ne $expected) {
            throw "Refus de compiler : commit inattendu. Attendu=$expected, obtenu=$actual"
          }
          $source = 'third_party/sherpa-onnx/sherpa-onnx/csrc/online-transducer-modified-beam-search-nemo-decoder.cc'
          if (!(Test-Path $source)) {
            throw "Decodeur Modified Beam Nemo introuvable : $source"
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.12' }}
          architecture: x64

      - name: Confirm CMake and Python
        shell: pwsh
        run: |
          cmake --version
          python --version
          python -m pip install --upgrade pip setuptools wheel numpy

      - name: Fix Windows wheel staging directory (CI-only)
        shell: pwsh
        working-directory: third_party/sherpa-onnx
        run: |
          # Sherpa 3df7adac omits mkdir for out_bin_dir in monolithic Windows wheel.
          # Patch only this runner's Python packaging helper; do not alter NeMo decoding.
          $path = 'cmake/cmake_extension.py'
          $source = [System.IO.File]::ReadAllText((Resolve-Path $path).Path)
          $needle = '        out_bin_dir = Path(self.build_lib).resolve().parent / "sherpa_onnx" / "bin"'
          if (([regex]::Matches($source, [regex]::Escape($needle))).Count -ne 1) {
            throw 'Unexpected Sherpa version: expected one out_bin_dir declaration; refusing patch.'
          }
          $replacement = $needle + "`n        out_bin_dir.mkdir(parents=True, exist_ok=True)"
          $updated = $source.Replace($needle, $replacement)
          [System.IO.File]::WriteAllText((Resolve-Path $path).Path, $updated, [System.Text.UTF8Encoding]::new($false))
          if (-not ($updated.Contains('out_bin_dir.mkdir(parents=True, exist_ok=True)'))) {
            throw 'Wheel staging fix was not applied.'
          }
          Write-Host 'Windows wheel staging directory fix applied to CI runner.'

      - name: Fix Python import stubs when TTS is disabled (CI-only)
        shell: pwsh
        working-directory: third_party/sherpa-onnx
        run: |
          # Source 3df7adac unconditionally imports GenerationConfig and
          # OfflineTtsSupertonicModelConfig from Python __init__.py, but
          # its TTS-off pybind branch does not export them. Add explicit
          # None placeholders, like the other unavailable TTS symbols.
          # This patch is only applied to the CI runner, not to Android.
          $path = 'sherpa-onnx/python/csrc/sherpa-onnx.cc'
          $source = [System.IO.File]::ReadAllText((Resolve-Path $path).Path)
          $needle = '  m.attr("GeneratedAudio") = py::none();'
          if (([regex]::Matches($source, [regex]::Escape($needle))).Count -ne 1) {
            throw 'Unexpected Sherpa source: TTS-off placeholder anchor not unique.'
          }
          $replacement = '  m.attr("GenerationConfig") = py::none();' + "`n" +
                         '  m.attr("OfflineTtsSupertonicModelConfig") = py::none();' + "`n" + $needle
          $source = $source.Replace($needle, $replacement)
          [System.IO.File]::WriteAllText((Resolve-Path $path).Path, $source, [System.Text.UTF8Encoding]::new($false))
          foreach ($symbol in @('GenerationConfig', 'OfflineTtsSupertonicModelConfig')) {
            if (-not ($source.Contains('m.attr("' + $symbol + '") = py::none();'))) {
              throw "Missing CI-only TTS placeholder: $symbol"
            }
          }
          Write-Host 'TTS-off Python placeholders inserted; ASR decoder unchanged.'

      - name: Instrument NeMo Modified Beam hypothesis scores (CI-only)
        shell: pwsh
        working-directory: third_party/sherpa-onnx
        run: |
          # This only modifies a temporary GitHub runner checkout.
          # No decoding scores, pruning, ranking, or Android artifacts are modified.
          $path = 'sherpa-onnx/csrc/online-transducer-modified-beam-search-nemo-decoder.cc'
          $file = (Resolve-Path $path).Path
          $source = [System.IO.File]::ReadAllText($file)
          $includeAnchor = '#include <algorithm>'
          if (([regex]::Matches($source, [regex]::Escape($includeAnchor))).Count -ne 1) {
            throw 'Trace instrumentation: C++ include anchor not unique.'
          }
          $source = $source.Replace($includeAnchor, $includeAnchor + "`n#include <cstdio>`n#include <cstdlib>")
          $anchor = '  Hypothesis best = hyps.GetMostProbable(false /*length_norm*/);'
          if (([regex]::Matches($source, [regex]::Escape($anchor))).Count -ne 1) {
            throw 'Trace instrumentation: GetMostProbable anchor not unique.'
          }
          $trace = @'
            // Guardian V9 lab-only logging, enabled by environment variable at replay.
            if (std::getenv("GUARDIAN_NEMO_BEAM_TRACE") != nullptr) {
              const auto top3 = hyps.GetTopK(3, false /*length_norm*/);
              for (size_t rank = 0; rank < top3.size(); ++rank) {
                const auto &h = top3[rank];
                std::fprintf(stderr,
                   "GV_BEAM_TRACE,beam=%d,frame=%d,rank=%zu,total=%d,tokens=%zu,score=%.12f,trailing_blanks=%d,key=%s\n",
                   max_active_paths, frame_offset + num_rows, rank + 1,
                   hyps.Size(), h.ys.size(), h.log_prob,
                   h.num_trailing_blanks, h.Key().c_str());
              }
              std::fflush(stderr);
            }
          '@
          $source = $source.Replace($anchor, $trace + "`n" + $anchor)
          [System.IO.File]::WriteAllText($file, $source, [System.Text.UTF8Encoding]::new($false))
          if (-not ($source.Contains('GV_BEAM_TRACE'))) {
            throw 'Trace instrumentation was not applied.'
          }
          Write-Host 'Diagnostic trace inserted into temporary Windows runner; decoding unchanged.'

      - name: Add opt-in N-best LAB-only output selector (CI-only)
        shell: pwsh
        working-directory: third_party/sherpa-onnx
        run: |
          # Default decoding is bit-for-bit unchanged unless the explicit
          # GUARDIAN_NEMO_NBEST_OVERRIDE env variable is set during a lab replay.
          # Do not carry this code into the Android app.
          $path = 'sherpa-onnx/csrc/online-transducer-modified-beam-search-nemo-decoder.cc'
          $file = (Resolve-Path $path).Path
          $source = [System.IO.File]::ReadAllText($file)
          $anchor = '  Hypothesis best = hyps.GetMostProbable(false /*length_norm*/);'
          if (([regex]::Matches($source, [regex]::Escape($anchor))).Count -ne 1) {
            throw 'N-best laboratory anchor is missing or ambiguous.'
          }
          $extra = @'
            // Guardian Voice V9 - opt-in N-best experiment. Never enabled in builds
            // without the lab variable. Pruned hypotheses are NOT resurrected.
            // Gate 0.15 is intentionally exploratory, tuned to *this* tiny sample;
            // it does not establish safety or generalization to emergencies.
            const bool gv_shadow =
                std::getenv("GUARDIAN_NEMO_NBEST_SHADOW") != nullptr;
            const bool gv_override =
                std::getenv("GUARDIAN_NEMO_NBEST_OVERRIDE") != nullptr;
            if ((gv_shadow || gv_override) && best.ys.empty()) {
              auto nbest = hyps.GetTopK(max_active_paths, false /*length_norm*/);
              for (const auto &candidate : nbest) {
                if (candidate.ys.empty()) {
                  continue;
                }
                const double gap = best.log_prob - candidate.log_prob;
                const bool gated = gap >= 0.0 && gap <= 0.15 &&
                                   candidate.ys.size() >= 3;
                std::fprintf(stderr,
                             "GV_NBEST_LAB,mode=%s,beam=%d,frame=%d,raw_tokens=0,"
                             "candidate_tokens=%zu,raw_score=%.12f,"
                             "candidate_score=%.12f,gap=%.12f,gate=%d,key=%s\n",
                             gv_override ? "override" : "shadow", max_active_paths,
                             frame_offset + num_rows, candidate.ys.size(),
                             best.log_prob, candidate.log_prob, gap,
                             gated ? 1 : 0, candidate.Key().c_str());
                std::fflush(stderr);
                if (gv_override && gated) {
                  best = candidate;
                }
                break;
              }
            }
          '@
          $source = $source.Replace($anchor, $anchor + "`n" + $extra)
          [System.IO.File]::WriteAllText($file, $source, [System.Text.UTF8Encoding]::new($false))
          if (-not ($source.Contains('GV_NBEST_LAB'))) {
            throw 'N-best laboratory code was not applied.'
          }
          Write-Host 'N-best lab-only selector inserted, disabled by default.'

      - name: Build a monolithic wheel from pinned sources
        shell: pwsh
        working-directory: third_party/sherpa-onnx
        run: |
          # IMPORTANT : ne pas definir SHERPA_ONNX_SPLIT_PYTHON_PACKAGE,
          # car sa simple presence activerait le paquet separe.
          Remove-Item Env:SHERPA_ONNX_SPLIT_PYTHON_PACKAGE -ErrorAction SilentlyContinue
          python setup.py bdist_wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist -Filter '*.whl' | Select-Object Name, Length

      - name: Smoke test installed package
        shell: pwsh
        run: |
          $wheel = Get-ChildItem 'third_party/sherpa-onnx/dist/*.whl' | Select-Object -First 1
          if (!$wheel) { throw 'Wheel non produit' }
          python -m pip install --no-deps --force-reinstall $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sherpa_onnx; print('Sherpa import OK:', sherpa_onnx.__file__); print('OnlineRecognizer:', sherpa_onnx.OnlineRecognizer)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload lab wheel
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nemotron-v9-NBEST-LAB-3df7adac-win-x64-python-${{ inputs.python_version || '3.12' }}
          path: third_party/sherpa-onnx/dist/*.whl
          if-no-files-found: error
          retention-days: 14
